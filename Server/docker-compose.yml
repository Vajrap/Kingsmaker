services:
    db:
        image: postgres:15
        container_name: kingsmaker_db
        restart: always
        ports:
            - "7432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: kingsmaker
        volumes:
            - postgres-data:/var/lib/postgresql/data

    monolith:
      build:
        context: ..
        dockerfile: Server/services/monolith/Dockerfile
      container_name: monolith_service
      ports:
        - "7777:3000"
      depends_on:
        - db
      environment:
        PORT: 3000
        DATABASE_URL: postgresql://postgres:postgres@db:5432/kingsmaker

volumes:
    postgres-data:
