<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">Welcome to KingsMaker</h1>
        <p class="page-subtitle">Login to your account or create a new one</p>
    </div>

    <div class="flex justify-center">
        <div class="card p-8" style="max-width: 400px; width: 100%;">
            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Enter your username"
                        required
                    />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                    />
                </div>

                <button type="submit" class="btn btn-primary w-full mb-4">
                    Login
                </button>
            </form>

            <!-- Guest Login -->
            <button id="guestBtn" class="btn btn-secondary w-full mb-4">
                Continue as Guest
            </button>

            <!-- Register Link -->
            <div class="text-center">
                <p class="text-sm text-secondary mb-2">Don't have an account?</p>
                <button id="registerBtn" class="btn btn-outline">
                    Create Account
                </button>
            </div>

            <!-- Error/Success Messages -->
            <div id="alertContainer" class="hidden"></div>
        </div>
    </div>

    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button id="themeToggle" class="btn btn-outline">
            🌙
        </button>
    </div>
</div>
