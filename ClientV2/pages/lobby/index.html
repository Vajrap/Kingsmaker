<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lobby - KingsMaker</title>
    <link rel="stylesheet" href="/pagesAndComponent/style.css">
    <link rel="stylesheet" href="/pagesAndComponent/lobby/style.css">
  </head>
  <body>
    <div id="app">
      <div class="page-container">
        <div class="page-header">
          <h1 class="page-title">Game Lobby</h1>
          <div class="page-subtitle">
            <span id="welcomeText">Welcome!</span>
            <span id="connectionStatus" class="ml-4 text-secondary">Connecting...</span>
          </div>
        </div>

        <div class="lobby-controls mb-6">
          <button id="refreshBtn" class="btn btn-secondary mr-4">
            Refresh Rooms
          </button>
          <button id="createRoomBtn" class="btn btn-primary">
            Create Room
          </button>
        </div>

        <div id="roomsList" class="rooms-container">
          <div class="loading-placeholder">
            <p>Loading rooms...</p>
          </div>
        </div>

        <!-- Create Room Modal -->
        <div id="createRoomModal" class="modal hidden">
          <div class="modal-content">
            <div class="modal-header">
              <h2>Create New Room</h2>
              <button id="closeCreateModal" class="btn btn-outline btn-sm">×</button>
            </div>
            
            <form id="createRoomForm" class="modal-body">
              <div class="form-group">
                <label class="form-label" for="roomName">Room Name</label>
                <input 
                  type="text" 
                  id="roomName" 
                  class="form-input" 
                  placeholder="Enter room name"
                  required
                  maxlength="30"
                />
              </div>

              <div class="form-group">
                <label class="form-label" for="maxPlayers">Max Players</label>
                <select id="maxPlayers" class="form-input" required>
                  <option value="2">2 Players</option>
                  <option value="3">3 Players</option>
                  <option value="4" selected>4 Players</option>
                  <option value="6">6 Players</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="turnTimeLimit">Turn Time Limit (seconds)</label>
                <select id="turnTimeLimit" class="form-input" required>
                  <option value="60">1 minute</option>
                  <option value="120">2 minutes</option>
                  <option value="300" selected>5 minutes</option>
                  <option value="600">10 minutes</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-checkbox">
                  <input type="checkbox" id="allowSpectators" />
                  <span class="checkmark"></span>
                  Allow Spectators
                </label>
              </div>
            </form>

            <div class="modal-footer">
              <button type="button" id="cancelCreateRoom" class="btn btn-secondary">
                Cancel
              </button>
              <button type="submit" id="confirmCreateRoom" class="btn btn-primary">
                <span id="createRoomBtnText">Create Room</span>
                <span id="createRoomSpinner" class="spinner hidden">Creating...</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Alert Container -->
        <div id="alertContainer" class="hidden"></div>
      </div>
    </div>
    <script type="module" src="./viewModel.ts"></script>
  </body>
</html>
